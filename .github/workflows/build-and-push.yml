name: Build and Deploy hello-fastapi

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.ver.outputs.tag }}
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The commit-SHA tag, computed once and used for BOTH what gets deployed
      # and what the app reports at /version. metadata-action's `version`
      # output is NOT this: with `type=raw,value=latest` listed first it
      # resolves to "latest", so using it meant CI always deployed the moving
      # tag and /version always answered "latest" — no traceability at all.
      # Derived from GITHUB_SHA (the same source metadata-action uses for
      # type=sha) so the two always agree.
      - name: Compute commit tag
        id: ver
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-deploy-agent:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Build signed payload and call deploy-agent
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
        run: |
          set -euo pipefail
          : "${DEPLOY_WEBHOOK_URL:?DEPLOY_WEBHOOK_URL secret is not set on this repo}"
          : "${DEPLOY_WEBHOOK_SECRET:?DEPLOY_WEBHOOK_SECRET secret is not set on this repo}"
          # Strip stray whitespace/newlines a copy-paste into the GitHub
          # secrets UI can silently leave in the stored value — a trailing
          # "\n" makes curl reject the URL as malformed.
          DEPLOY_WEBHOOK_URL=$(printf '%s' "$DEPLOY_WEBHOOK_URL" | tr -d '[:space:]')
          DEPLOY_WEBHOOK_SECRET=$(printf '%s' "$DEPLOY_WEBHOOK_SECRET" | tr -d '[:space:]')
          PAYLOAD=$(printf '{"service":"hello-fastapi","image":"%s"}' "$IMAGE_REF")
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | sed 's/^.* //')
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Signature-256: sha256=$SIGNATURE" \
            --data "$PAYLOAD" \
            "$DEPLOY_WEBHOOK_URL"
